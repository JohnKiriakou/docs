<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs</title>
    <link rel="icon" href="favicon2.ico">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #000;
            --text-grey: #444;
            --text-light-grey: #888;
            --text-white: #fff;
            --live-red: #ff0000;
            --yellow: #ffff00;
            --outline: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-light-grey);
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
            transition: background-color 0.1s ease;
        }

        #game-container {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; width: 100%; opacity: 0; transition: opacity 0.8s ease; gap: 20px;
        }

        #game-container.visible { display: flex; opacity: 1; }

        button, .actor-label {
            background: transparent; border: none; cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease, opacity 0.3s;
            outline: none; color: var(--text-light-grey);
            font-family: 'Bebas Neue', sans-serif; text-align: center;
        }

        button:hover:not(:disabled), .actor-label:hover { color: var(--text-white); }

        #start-button { font-size: 5rem; letter-spacing: 5px; }
        .actor-label { font-size: 4rem; letter-spacing: 3px; width: 100%; }

        .active-turn { color: var(--text-white); text-decoration: underline; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #game-msg {
            font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text-white);
            height: 3rem; display: flex; align-items: center; justify-content: center;
            text-align: center; opacity: 0; transition: opacity 0.2s ease; width: 100%;
        }

        #shells-display { font-size: 6rem; display: flex; gap: 30px; }
        .live-count { color: var(--live-red); text-shadow: var(--outline); }
        .blank-count { color: var(--text-grey); text-shadow: var(--outline); }

        #back-out { position: absolute; bottom: 30px; left: 30px; font-size: 1.5rem; letter-spacing: 1px; }
        #stats { position: absolute; top: 25px; right: 35px; font-size: 1rem; font-weight: bold; color: var(--text-grey); }

        .hidden { display: none !important; }
        .show-msg { opacity: 1 !important; }
        #start-screen { display: flex; flex-direction: column; align-items: center; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-effect { animation: shake 0.4s; animation-iteration-count: 1; }
        .flash-red { background-color: rgba(255, 0, 0, 0.3) !important; }
        .flash-green { background-color: rgba(0, 128, 21, 0.4) !important; } 

        @keyframes blankShake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            75% { transform: translate(1px, -1px) rotate(0.1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        .blank-shake-effect {
            animation: blankShake 0.15s;
            animation-iteration-count: 1;
        }

        #disable-animations-container {
            position: absolute; 
            bottom: 30px; 
            right: 30px;
            font-family: 'Bebas Neue', sans-serif; 
            font-size: 1.2rem;
            color: var(--text-grey); 
            display: flex; 
            align-items: center;
            gap: 10px;
            cursor: pointer; 
            user-select: none; 
            transition: color 0.3s ease;
            line-height: 1;
        }

        #disable-animations-container:has(#disable-animations:checked) {
            color: var(--text-white);
        }

        #disable-animations {
            appearance: none;
            -webkit-appearance: none;
            width: 16px; 
            height: 16px;
            border: 2px solid var(--text-grey);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            
            margin: 0; 
            transform: translateY(-1px);
        }

        #disable-animations-container:hover #disable-animations {
            border-color: var(--text-white);
        }

        #disable-animations:checked {
            background-color: var(--text-white);
            border-color: var(--text-white) !important;
        }

        #disable-animations:checked::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 8px; height: 8px;
            background: var(--bg-color);
        }

        #disable-animations-container:has(#disable-animations:checked) {
            color: var(--text-white);
        }

        #disable-animations:checked {
            background-color: var(--text-white);
            border-color: var(--text-white);
        }

        .stat-pop {
            position: absolute; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
            pointer-events: none; animation: fadeUp 1s ease-out forwards; z-index: 100;
        }
        .pop-win { color: #00ff00; }
        .pop-loss { color: #ff0000; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(20px); } }

        #stats-toggle { position: absolute; top: 25px; right: 35px; font-size: 1.5rem; letter-spacing: 1px; }
        #stats-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center;
            flex-direction: column; z-index: 1000; font-family: 'Bebas Neue', sans-serif;
        }
        #stats-content { text-align: center; color: var(--text-white); }
        #stats-content h2 { font-size: 4rem; margin-bottom: 10px; }
        #stats-content p { font-size: 2rem; color: var(--text-light-grey); margin: 5px; }

        #luck-meter {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--text-grey);
    letter-spacing: 2px;
    transition: color 0.3s ease;
}

#round-counter {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--text-grey);
    letter-spacing: 2px;
    opacity: 1;
    transition: opacity 0.3s ease;
}

#game-container:has(#back-out.hidden) #round-counter {
    opacity: 0;
}

@media (max-width: 600px) {
    #start-button { font-size: 3rem; }
    .actor-label { font-size: 2.5rem; }
    #shells-display { font-size: 4rem; gap: 15px; }
    
    #stats { 
        top: 10px; 
        right: 15px; 
        font-size: 0.8rem; 
    }
    
    #luck-meter { 
        top: 40px;
        font-size: 1.2rem; 
    }

    #stats-toggle {
        top: 10px;
        right: 15px;
        font-size: 1.2rem;
    }

    #back-out {
        bottom: 15px;
        left: 15px;
        font-size: 1.2rem;
    }

    #round-counter {
        bottom: 15px;
        font-size: 1.2rem;
    }

    #game-container {
        gap: 10px;
        padding: 20px;
        box-sizing: border-box;
    }

    #game-msg {
        font-size: 1.5rem;
    }
}

@media (max-height: 500px) {
    #game-container { gap: 5px; }
    .actor-label { font-size: 2rem; }
    #shells-display { font-size: 3rem; }
    #luck-meter { top: 10px; left: 20px; transform: none; }
}

.high-risk { color: var(--live-red) !important; text-shadow: 0 0 10px var(--live-red); }
.med-risk { color: var(--yellow) !important; text-shadow: 0 0 10px var(--yellow); }

#multiplayer-button { 
        font-size: 2.5rem; 
        letter-spacing: 3px; 
        margin-top: 10px; 
    }

    #multi-menu {
        display: none;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }

    .menu-btn { font-size: 3rem; letter-spacing: 3px; }

    #join-input {
        background: transparent;
        border: 2px solid var(--text-grey);
        color: var(--text-white);
        font-family: 'Bebas Neue', sans-serif;
        font-size: 2rem;
        text-align: center;
        padding: 10px;
        text-transform: uppercase;
        outline: none;
    }

    #join-input::placeholder { color: var(--text-grey); }

    #lobby-status {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.5rem;
        color: var(--yellow);
        margin-top: 10px;
    }

    .copy-hint { font-size: 0.8rem; color: var(--text-grey); margin-top: -10px; }

#turn-indicator {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    color: var(--text-white);
    letter-spacing: 5px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    margin-bottom: -20px;
}

#turn-indicator.visible {
    opacity: 1;
    animation: pulse 1.5s infinite;
}

.settings-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

#session-stats {
    font-size: 0.75rem;
    color: #666;
    margin-top: 4px;
    letter-spacing: 1px;
}

#session-stats.visible {
    opacity: 1;
}

.status-active {
    color: var(--yellow) !important;
    animation: pulse 1.5s infinite;
}

    </style>
</head>
<body>

    <div id="start-screen">
        <button id="stats-toggle">STATS</button>
        <button id="start-button">START</button>
        <button id="multiplayer-button">MULTIPLAYER</button>
    
    <div id="multi-menu">
        <button id="host-btn" class="menu-btn">HOST</button>
        <button id="join-btn" class="menu-btn">JOIN</button>
        <div id="join-container" class="hidden">
            <input type="text" id="join-input" maxlength="4" placeholder="ENTER CODE">
            <button id="confirm-join" class="menu-btn" style="font-size: 2rem;">GO</button>
        </div>
        <div id="lobby-status"></div>
        <button id="multi-back" style="font-size: 1.5rem; margin-top: 20px;">BACK</button>
    </div>
    </div>

    <div id="game-container">
        <div id="turn-indicator">YOUR TURN</div>
        <div id="luck-meter">LUCK: 0%</div>
        <div id="stats">WINS: 0 | LOSSES: 0</div>
        <div id="session-stats" class="hidden">SESSION SCORE: 0 - 0</div>
        <div id="dealer" class="actor-label">DEALER</div>
        <div id="game-msg"></div>
        <div id="shells-display"></div>
        <div id="player" class="actor-label">PLAYER</div>
        <div id="round-counter">ROUND #1</div>
        <button id="back-out">BACK OUT</button>
    </div>

    <label id="disable-animations-container">
        <input type="checkbox" id="disable-animations"> DISABLE ANIMATIONS
    </label>

    <div id="stats-overlay">
        <div id="stats-content">
            <h2>STATS</h2>
            <p id="total-wins">WINS: 0</p>
            <p id="total-losses">LOSSES: 0</p>
            <p id="win-rate">WIN RATE: 0%</p>
            <button id="close-stats">CLOSE</button>
        </div>
    </div>

    <script>
    const startScreen = document.getElementById('start-screen');
    const startButton = document.getElementById('start-button');
    const gameContainer = document.getElementById('game-container');
    const dealerBtn = document.getElementById('dealer');
    const playerBtn = document.getElementById('player');
    const shellsDisplay = document.getElementById('shells-display');
    const backOutBtn = document.getElementById('back-out');
    const statsDisplay = document.getElementById('stats');
    const gameMsg = document.getElementById('game-msg');
    const disableAnimationsCheck = document.getElementById('disable-animations');
    const statsToggle = document.getElementById('stats-toggle');
    const statsOverlay = document.getElementById('stats-overlay');
    const closeStats = document.getElementById('close-stats');
    const totalWinsText = document.getElementById('total-wins');
    const totalLossesText = document.getElementById('total-losses');
    const winRateText = document.getElementById('win-rate');
    const luckMeter = document.getElementById('luck-meter');
    const roundCounter = document.getElementById('round-counter');
    const multiBtn = document.getElementById('multiplayer-button');
    const multiMenu = document.getElementById('multi-menu');
    const hostBtn = document.getElementById('host-btn');
    const joinBtn = document.getElementById('join-btn');
    const joinContainer = document.getElementById('join-container');
    const joinInput = document.getElementById('join-input');
    const confirmJoin = document.getElementById('confirm-join');
    const lobbyStatus = document.getElementById('lobby-status');
    const multiBack = document.getElementById('multi-back');
    const turnIndicator = document.getElementById('turn-indicator');

    // --- GAME STATE ---
    let peer = null;
    let conn = null;
    let isMultiplayer = false;
    let isHost = false;
    let currentRound = 1;
    let lives = 0, blanks = 0, total = 0, canBackOut = true;
    let wins = parseInt(localStorage.getItem('roulette_wins')) || 0;
    let losses = parseInt(localStorage.getItem('roulette_losses')) || 0;
    let isPlayerTurn = true;
    let isProcessing = false;
    let sessionWins = 0;
    let sessionLosses = 0;
    const sessionDisplay = document.getElementById('session-stats');

    disableAnimationsCheck.checked = localStorage.getItem('roulette_disable_anims') === 'true';

    function updateStatsUI() {
        statsDisplay.textContent = `WINS: ${wins} | LOSSES: ${losses}`;
        sessionDisplay.textContent = `SESSION: ${sessionWins} - ${sessionLosses}`;
        localStorage.setItem('roulette_wins', wins);
        localStorage.setItem('roulette_losses', losses);
    }

    function updateShellsUI() {
        shellsDisplay.innerHTML = `<span class="live-count">${lives}L</span><span class="blank-count">${blanks}B</span>`;
        const probability = total > 0 ? Math.round((lives / total) * 100) : 0;
        luckMeter.textContent = `RISK: ${probability}%`;
        luckMeter.classList.remove('high-risk', 'med-risk');
        if (probability >= 51) luckMeter.classList.add('high-risk');
        else if (probability === 50) luckMeter.classList.add('med-risk');
    }

    function updateTurnVisuals() {
        // In multiplayer, 'player' is always the local user.
        if (isPlayerTurn) {
            playerBtn.classList.add('active-turn');
            dealerBtn.classList.remove('active-turn');
            if (isMultiplayer) turnIndicator.classList.add('visible');
        } else {
            dealerBtn.classList.add('active-turn');
            playerBtn.classList.remove('active-turn');
            turnIndicator.classList.remove('visible');
        }
    }

    async function showMessage(text, duration = 1200, isLive = false, color = 'flash-red') {
        return new Promise(resolve => {
            gameMsg.textContent = text;
            gameMsg.classList.add('show-msg');
            if (isLive) triggerLiveEffects(color);
            setTimeout(() => {
                gameMsg.classList.remove('show-msg');
                setTimeout(resolve, 300);
            }, duration);
        });
    }

    function triggerLiveEffects(colorClass) {
        if (disableAnimationsCheck.checked) return;
        gameContainer.classList.add('shake-effect');
        document.body.classList.add(colorClass);
        setTimeout(() => {
            gameContainer.classList.remove('shake-effect');
            document.body.classList.remove(colorClass);
        }, 400);
    }

    function triggerBlankEffects() {
        if (disableAnimationsCheck.checked) return;
        gameContainer.classList.add('blank-shake-effect');
        setTimeout(() => { gameContainer.classList.remove('blank-shake-effect'); }, 150);
    }

    // --- MULTIPLAYER SETUP ---
    function setupPeer(id = null) {
        peer = new Peer(id, { debug: 1 });
        peer.on('open', (openedId) => {
            if (isHost) {
                lobbyStatus.innerHTML = `ROOM CODE: <span style="color:white; cursor:pointer;" onclick="navigator.clipboard.writeText('${openedId}')">${openedId}</span><br><span class="copy-hint">CLICK TO COPY</span>`;
            }
        });
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnHandlers();
            if (isHost) {
                lobbyStatus.textContent = "PLAYER CONNECTED! STARTING...";
                setTimeout(startMultiplayerGame, 1500);
            }
        });
        peer.on('error', (err) => { console.error(err); resetToMain(); });
    }

    function setupConnHandlers() {
        conn.on('data', (data) => {
            if (data.type === 'INIT_ROUND') {
                lives = data.lives;
                blanks = data.blanks;
                total = lives + blanks;
                isPlayerTurn = data.isPlayerTurn;
                currentRound = data.round;
                beginGameUI();
            } else if (data.type === 'SHOT_RESULT') {
                handleRemoteShot(data);
            } else if (data.type === 'DISCONNECT') {
                alert("Opponent left.");
                location.reload();
            }
        });
    }

    function startMultiplayerGame() {
        currentRound = 1;
        initMultiRound();
    }

    function initMultiRound() {
        lives = 1;
        blanks = Math.floor(Math.random() * 4) + 1;
        total = lives + blanks;
        isPlayerTurn = true; // Host starts
        
        conn.send({
            type: 'INIT_ROUND',
            lives: lives,
            blanks: blanks,
            round: currentRound,
            isPlayerTurn: false // Guest sees it as not their turn
        });
        beginGameUI();
    }

function beginGameUI() {
    isProcessing = false;
    canBackOut = true;
    startScreen.classList.add('hidden');
    gameContainer.style.display = 'flex';
    setTimeout(() => { gameContainer.classList.add('visible'); }, 50);
    
    if (isMultiplayer) {
        sessionDisplay.classList.remove('hidden');
    } else {
        sessionDisplay.classList.add('hidden');
    }

    updateStatsUI();
    roundCounter.textContent = `ROUND #${currentRound}`;
    backOutBtn.classList.remove('hidden');
    if (isMultiplayer) {
        dealerBtn.textContent = "OPPONENT";
        playerBtn.textContent = "YOU";
    }
    updateShellsUI();
    updateTurnVisuals();
}

    // --- ACTION LOGIC ---
    async function shoot(target) {
        if (isProcessing || !isPlayerTurn || gameMsg.classList.contains('show-msg')) return;
        
        isProcessing = true; // Lock local input
        const isLive = Math.random() < (lives / total);

        if (isMultiplayer) {
            conn.send({ type: 'SHOT_RESULT', target: target, isLive: isLive });
        }
        processShotResult(target, isLive, false);
    }

    function handleRemoteShot(data) {
        // Invert: if they shot 'player' (themselves), it's 'dealer' (opponent) to us.
        const localTarget = data.target === 'player' ? 'dealer' : 'player';
        processShotResult(localTarget, data.isLive, true);
    }

async function processShotResult(target, isLive, isRemote) {
    isProcessing = true;
    canBackOut = false;
    backOutBtn.classList.add('hidden');
    turnIndicator.classList.remove('visible');

    if (isLive) {
        lives--; total--; updateShellsUI();

        if (target === 'dealer') {
            wins++; 
            if (isMultiplayer) sessionWins++; // Track current match wins
            showStatPop('win');
            await showMessage("LIVE! " + (isRemote ? "THEY HIT THEMSELVES" : "YOU HIT THEM"), 1200, true, 'flash-green');
        } else {
            losses++; 
            if (isMultiplayer) sessionLosses++; // Track current match losses
            showStatPop('loss');
            await showMessage("LIVE! " + (isRemote ? "THEY HIT YOU" : "YOU HIT YOURSELF"), 1200, true, 'flash-red');
        }
        
        updateStatsUI();
        currentRound++;

        if (isMultiplayer) {
            if (isHost) setTimeout(initMultiRound, 1500);
        } else {
            initRound(); 
        }
    } else {
        blanks--; 
        total--; 
        updateShellsUI();
        triggerBlankEffects();
        await showMessage("BLANK.", 800);
        
        isPlayerTurn = (target === 'player');
        
        isProcessing = false;
        updateTurnVisuals();

        if (total > 0) {
            backOutBtn.classList.remove('hidden');
            canBackOut = true;
        }

        if (!isMultiplayer && !isPlayerTurn) setTimeout(dealerAI, 1000);
    }
}

    // --- SINGLE PLAYER FALLBACK ---
    function initRound() {
        lives = 1; blanks = Math.floor(Math.random() * 4) + 1; total = lives + blanks;
        isPlayerTurn = true;
        beginGameUI();
    }

    async function dealerAI() {
        if (total === 0 || isMultiplayer) return;
        await showMessage("DEALER IS DECIDING...", 800);
        const choice = Math.random() < 0.5 ? 'self' : 'player';
        const isLive = Math.random() < (lives / total);
        
        if (choice === 'self') {
            await showMessage("DEALER POINTS AT ITSELF...");
            processShotResult('dealer', isLive, true);
        } else {
            await showMessage("DEALER POINTS AT YOU...");
            processShotResult('player', isLive, true);
        }
    }

    // --- EVENT LISTENERS ---
    startButton.addEventListener('click', () => {
        isMultiplayer = false;
        currentRound = 1;
        initRound();
    });

    multiBtn.addEventListener('click', () => {
        startButton.classList.add('hidden');
        multiBtn.classList.add('hidden');
        multiMenu.style.display = 'flex';
    });

    hostBtn.addEventListener('click', () => {
        isHost = true; isMultiplayer = true;
        hostBtn.classList.add('hidden'); joinBtn.classList.add('hidden');
        const code = Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => (b % 36).toString(36).toUpperCase()).join('');
        setupPeer(code);
        sessionWins = 0;
        sessionLosses = 0;
    });

    joinBtn.addEventListener('click', () => {
        hostBtn.classList.add('hidden'); joinBtn.classList.add('hidden');
        joinContainer.classList.remove('hidden');
    });

    confirmJoin.addEventListener('click', () => {
        const code = joinInput.value.toUpperCase().trim();
        
        if (code.length !== 4) {
            lobbyStatus.textContent = "INVALID CODE (4 CHARS REQUIRED)";
            return;
        }

        // --- VISUAL FEEDBACK START ---
        confirmJoin.disabled = true;
        confirmJoin.textContent = "CONNECTING...";
        lobbyStatus.textContent = `LOCATING ROOM: ${code}...`;
        lobbyStatus.classList.add('status-active');
        lobbyStatus.classList.remove('hidden');
        // ------------------------------

        isHost = false; 
        isMultiplayer = true;
        sessionWins = 0;
        sessionLosses = 0;

        setupPeer(); // Initialize local peer

        peer.on('open', () => {
            lobbyStatus.textContent = "PEER INITIALIZED. HANDSHAKING...";
            
            conn = peer.connect(code);
            setupConnHandlers();

            // Check if the connection actually opens
            conn.on('open', () => {
                lobbyStatus.textContent = "CONNECTED! WAITING FOR HOST...";
            });
        });

        // Handle errors (like wrong code or timeout)
        peer.on('error', (err) => {
            confirmJoin.disabled = false;
            confirmJoin.textContent = "GO";
            lobbyStatus.classList.remove('status-active');
            
            if (err.type === 'peer-unavailable') {
                lobbyStatus.textContent = "ROOM NOT FOUND. CHECK CODE.";
            } else {
                lobbyStatus.textContent = "CONNECTION FAILED.";
                console.error(err);
            }
        });
    });

    dealerBtn.addEventListener('click', () => shoot('dealer'));
    playerBtn.addEventListener('click', () => shoot('player'));
    multiBack.addEventListener('click', () => location.reload());
    
    backOutBtn.addEventListener('click', () => {
        if (canBackOut) {
            if (isMultiplayer && conn) conn.send({ type: 'DISCONNECT' });
            location.reload();
        }
    });

    statsToggle.addEventListener('click', () => {
        const totalGames = wins + losses;
        const winRate = totalGames > 0 ? ((wins / totalGames) * 100).toFixed(1) : 0;
        totalWinsText.textContent = `WINS: ${wins}`;
        totalLossesText.textContent = `LOSSES: ${losses}`;
        winRateText.textContent = `WIN RATE: ${winRate}%`;
        statsOverlay.style.display = 'flex';
    });

    closeStats.addEventListener('click', () => statsOverlay.style.display = 'none');

    function showStatPop(type) {
        const statsRect = statsDisplay.getBoundingClientRect();
        const pop = document.createElement('div');
        pop.textContent = "+1";
        pop.className = `stat-pop ${type === 'win' ? 'pop-win' : 'pop-loss'}`;
        pop.style.left = (statsRect.left + (type === 'win' ? 30 : statsRect.width - 30)) + 'px';
        pop.style.top = (statsRect.bottom + 5) + 'px';
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
    }
    </script>
</body>
</html>
